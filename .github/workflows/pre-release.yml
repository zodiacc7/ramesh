name: Pre-release

on:
  workflow_dispatch:
  push:
    tags:
      # Three-part (1.1.0-pre) and four-part (1.1.0.04-pre) pre-release tags.
      - "[0-9]+.[0-9]+.[0-9]+-pre"
      - "[0-9]+.[0-9]+.[0-9]+.[0-9]+-pre"

permissions:
  contents: write

concurrency:
  group: pre-release
  cancel-in-progress: false

jobs:
  pre-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [[ "$VERSION" == v* ]]; then
            echo "::error::versionName must not include a 'v' prefix (got $VERSION)"
            exit 1
          fi
          CODE=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          TAG="${VERSION}-pre"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "App version is $VERSION (pre-release tag $TAG)"

      - name: Ensure git tag matches versionName-pre
        if: github.ref_type == 'tag'
        run: |
          if [[ "${{ github.ref_name }}" != "${{ steps.version.outputs.tag }}" ]]; then
            echo "::error::Git tag ${{ github.ref_name }} must equal ${{ steps.version.outputs.tag }}"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Decode signing keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [[ -z "$SIGNING_KEYSTORE" ]]; then
            echo "::error::SIGNING_KEYSTORE secret is missing"
            exit 1
          fi
          echo "$SIGNING_KEYSTORE" | tr -d '\n\r ' | base64 --decode > "$RUNNER_TEMP/ramesh-release.jks"
          test -s "$RUNNER_TEMP/ramesh-release.jks"

      - name: Build signed release APK
        env:
          SIGNING_STORE_FILE: ${{ runner.temp }}/ramesh-release.jks
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK is signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          SIGNED="app/build/outputs/apk/release/app-release.apk"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ -f "$UNSIGNED" && ! -f "$SIGNED" ]]; then
            echo "::error::Release APK was not signed. Check signing secrets."
            exit 1
          fi
          test -f "$SIGNED"
          "$APKSIGNER" verify --verbose "$SIGNED"

      - name: Prepare release artifacts
        env:
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ramesh-${TAG}-universal.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS

      - name: Publish GitHub Pre-release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          # Curated, bilingual notes from fastlane (keyed by versionCode), like the stable releases.
          NOTES="--generate-notes"
          EN_NOTES="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          FA_NOTES="fastlane/metadata/android/fa-IR/changelogs/${CODE}.txt"
          if [[ -f "$EN_NOTES" ]]; then
            BODY="$RUNNER_TEMP/release-notes.md"
            cat "$EN_NOTES" > "$BODY"
            if [[ -f "$FA_NOTES" ]]; then
              printf '\n\n---\n\n## فارسی\n\n' >> "$BODY"
              cat "$FA_NOTES" >> "$BODY"
            fi
            NOTES="--notes-file $BODY"
            echo "Using release notes from $EN_NOTES (+ $FA_NOTES)"
          fi
          gh release create "$TAG" \
            --title "$TAG" \
            $NOTES \
            --prerelease \
            --latest=false \
            "dist/ramesh-${TAG}-universal.apk" \
            dist/SHA256SUMS
