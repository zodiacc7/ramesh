name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee build.log
          ./gradlew testDebugUnitTest 2>&1 | tee -a build.log

      # The release build is the one users install, and it runs R8 with the project's own
      # keep rules. Building it here catches shrinker-only breakage (a class kept in debug but
      # stripped in release) before a tag is pushed.
      - name: Build release APK (R8)
        run: |
          set -o pipefail
          ./gradlew assembleRelease --stacktrace 2>&1 | tee -a release.log || {
            tr -d '\r' < release.log \
              | grep -E '^e: |^FAILURE: |What went wrong|Execution failed for task|R8|Missing class' \
              | head -n 50 \
              | sed 's/%/%25/g' \
              | awk '{ printf "::error::%s\n", $0 }'
            exit 1
          }

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ramesh-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # Publish an installable debug build so testers always have a fresh APK
      # without digging through Actions artifacts.
      - name: Publish debug APK
        if: success() && github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/*.apk ramesh-debug.apk
          gh release view debug-latest > /dev/null 2>&1 || gh release create debug-latest \
            --prerelease \
            --title "Debug build" \
            --notes "Automatic debug build of \`main\`. Unsigned, package \`com.ramesh.sms.dev\`, installs next to the release build."
          gh release upload debug-latest ramesh-debug.apk --clobber

      # CI logs are not always reachable from automation, so surface the
      # interesting parts of the Gradle output as check annotations.
      - name: Report build failure
        if: failure()
        run: |
          if [ -f build.log ]; then
            tr -d '\r' < build.log > build-clean.log
            grep -E '^e: |^FAILURE: |What went wrong|Execution failed for task|Could not (resolve|find|open)|Unresolved reference' build-clean.log \
              | head -n 50 \
              | sed 's/%/%25/g' \
              | awk '{ printf "::error::%s\n", $0 }'
          fi
