name: Release

on:
  workflow_dispatch:
  push:
    tags:
      # Stable tags (1.0.0) and beta tags (1.1.0-beta.1) both build a signed APK.
      - "[0-9]+.[0-9]+.[0-9]+"
      - "[0-9]+.[0-9]+.[0-9]+-*"

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Read app version
        id: version
        run: |
          VERSION=$(sed -nE 's/^[[:space:]]*versionName = "([^"]+)".*/\1/p' app/build.gradle.kts)
          CODE=$(sed -nE 's/^[[:space:]]*versionCode = ([0-9]+).*/\1/p' app/build.gradle.kts)
          if [[ -z "$VERSION" ]]; then
            echo "::error::Could not read versionName from app/build.gradle.kts"
            exit 1
          fi
          if [[ "$VERSION" == v* ]]; then
            echo "::error::versionName must not include a 'v' prefix (got $VERSION)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "code=$CODE" >> "$GITHUB_OUTPUT"
          echo "App version is $VERSION (versionCode $CODE)"

      - name: Ensure git tag matches versionName
        if: github.ref_type == 'tag'
        run: |
          if [[ "${{ github.ref_name }}" != "${{ steps.version.outputs.version }}" ]]; then
            echo "::error::Git tag ${{ github.ref_name }} must equal versionName ${{ steps.version.outputs.version }}"
            exit 1
          fi

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The key is never in the repository. See keystore/README.md for the secret names and how to
      # restore them; without them we refuse to build rather than publish an unsigned APK.
      - name: Prepare signing keystore
        env:
          SIGNING_KEYSTORE: ${{ secrets.SIGNING_KEYSTORE }}
        run: |
          if [[ -z "$SIGNING_KEYSTORE" ]]; then
            echo "::error::SIGNING_KEYSTORE secret is not set. Add the four signing secrets documented in keystore/README.md."
            exit 1
          fi
          echo "$SIGNING_KEYSTORE" | tr -d '\n\r ' | base64 --decode > "$RUNNER_TEMP/ramesh-release.p12"
          if [[ ! -s "$RUNNER_TEMP/ramesh-release.p12" ]]; then
            echo "::error::SIGNING_KEYSTORE did not decode to a keystore file."
            exit 1
          fi
          echo "SIGNING_STORE_FILE=$RUNNER_TEMP/ramesh-release.p12" >> "$GITHUB_ENV"
          echo "SIGNING_STORE_TYPE=PKCS12" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          SIGNING_STORE_PASSWORD: ${{ secrets.SIGNING_STORE_PASSWORD }}
          SIGNING_KEY_ALIAS: ${{ secrets.SIGNING_KEY_ALIAS }}
          SIGNING_KEY_PASSWORD: ${{ secrets.SIGNING_KEY_PASSWORD }}
        run: ./gradlew assembleRelease --stacktrace

      - name: Verify APK is signed
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          SIGNED="app/build/outputs/apk/release/app-release.apk"
          UNSIGNED="app/build/outputs/apk/release/app-release-unsigned.apk"
          if [[ -f "$UNSIGNED" && ! -f "$SIGNED" ]]; then
            echo "::error::Release APK was not signed. Check signing secrets."
            exit 1
          fi
          test -f "$SIGNED"
          "$APKSIGNER" verify --verbose "$SIGNED"

      - name: Prepare release artifacts
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release.apk "dist/ramesh-${VERSION}-universal.apk"
          sha256sum dist/*.apk | tee dist/SHA256SUMS

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
          CODE: ${{ steps.version.outputs.code }}
        run: |
          # Beta builds (1.2.0-beta.1) are always published as prereleases so that nobody gets
          # them through the "latest release" link.
          PRERELEASE=""
          if [[ "$VERSION" == *-* ]]; then
            PRERELEASE="--prerelease"
          fi
          APK="dist/ramesh-${VERSION}-universal.apk"

          # Prefer the curated notes that ship with the app (fastlane changelogs). Generated notes
          # stop being useful once older releases are removed, and they cannot mention anything
          # that is not a pull request title.
          NOTES="--generate-notes"
          NOTES_FILE="fastlane/metadata/android/en-US/changelogs/${CODE}.txt"
          if [[ -f "$NOTES_FILE" ]]; then
            NOTES="--notes-file $NOTES_FILE"
            echo "Using release notes from $NOTES_FILE"
          fi
          ls -l "$APK" dist/SHA256SUMS

          # Start from a clean slate: a half-uploaded draft would block the next attempt.
          gh release delete "$VERSION" --yes --cleanup-tag=false || true

          # Upload with retries: the runner occasionally drops an asset upload.
          upload() {
            for attempt in 1 2 3 4 5; do
              if gh release "$@" ; then
                return 0
              fi
              echo "upload attempt $attempt failed, retrying..."
              sleep 5
            done
            return 1
          }

          upload create "$VERSION" --title "$VERSION" $NOTES $PRERELEASE --verify-tag "$APK"
          gh release upload "$VERSION" dist/SHA256SUMS --clobber

          # Make sure the release is public (gh leaves it as a draft if an upload failed).
          gh release edit "$VERSION" --draft=false
          gh release view "$VERSION" --json assets,isPrerelease
